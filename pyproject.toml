[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
description = "Root an Echo Dot (2nd Generation), move it between amonet targets, or return it to stock"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
name = "firebreak"
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"

[project.scripts]
firebreak = "firebreak.__main__:main"

[project.urls]
Source = "https://github.com/bboe/firebreak"

[tool.coverage.paths]
firebreak = ["firebreak/", "*/site-packages/firebreak/"]

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
omit = ["*/firebreak/__main__.py"]
parallel = true
source_pkgs = ["firebreak"]

[tool.ruff]
preview = true
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "D1",
    "incorrect-blank-line-before-class",
    "missing-blank-line-after-summary",
    "missing-copyright-notice",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "print",
    "single-line-implicit-string-concatenation",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "suspicious-url-open-usage",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",
    "boolean-type-hint-positional-argument",
    "compare-to-empty-string",
    "hardcoded-temp-file",
    "implicit-namespace-package",
    "magic-value-comparison",
    "pytest-fixture-autouse",
]

[tool.tomlsort]
sort_table_keys = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true

[tool.tox]
env_list = ["lint", "build", "floor"]
requires = ["tox>=4.21", "tox-uv"]

[tool.tox.env.build]
allowlist_externals = ["rm", "uv"]
commands = [
    ["rm", "-rf", "build", "dist"],
    ["uv", "build", "--quiet"],
    [
        "python",
        "-c",
        "import pathlib, zipapp; pathlib.Path('build').mkdir(); zipapp.create_archive('.', 'build/firebreak.pyz', '/usr/bin/env python3', 'firebreak.__main__:main', lambda p: p.parts[0] == 'firebreak' and '__pycache__' not in p.parts, True)",
    ],
]
skip_install = true

[tool.tox.env.floor]
base_python = ["/usr/bin/python3"]
commands = [
    ["coverage", "run", "-m", "pytest", { replace = "posargs", extend = true }],
    ["coverage", "combine", "--quiet"],
    ["coverage", "report"],
    ["coverage", "html", "--quiet"],
    ["coverage", "json", "--quiet"],
    [
        "python",
        "-c",
        "import json, sys; files = json.load(open('coverage.json'))['files']; low = [f'{name}: {data[\"summary\"][\"percent_covered\"]:.1f}%' for name, data in sorted(files.items()) if data['summary']['percent_covered'] < 90]; sys.exit('under 90% coverage:\\n' + '\\n'.join(low) if low else 0)",
    ],
]
depends = ["build"]
deps = ["coverage==7.10.7", "pytest"]
package = "wheel"

[tool.tox.env.lint]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit==4.6.2"]
set_env = { SKIP = "no-commit-to-branch" }
skip_install = true
