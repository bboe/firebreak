[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = ["pyserial==3.5", "pyusb==1.3.1", "update_checker==1.0.1"]
description = "Root an Echo Dot (2nd Generation), an Echo (2nd Generation) or an Echo Dot (3rd Generation), or return it to stock"
dynamic = ["version"]
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
name = "firebreak"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
brotli = ["Brotli==1.1.0"]

[project.scripts]
firebreak = "firebreak.__main__:main"

[project.urls]
Changelog = "https://github.com/bboe/firebreak/blob/main/CHANGELOG.md"
Source = "https://github.com/bboe/firebreak"

[tool.coverage.paths]
firebreak = ["firebreak/", "*/site-packages/firebreak/"]

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
omit = ["*/firebreak/__main__.py"]
parallel = true
source_pkgs = ["firebreak"]

[tool.hatch.version]
path = "firebreak/__init__.py"

[tool.ruff]
preview = true
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "D1",
    "incorrect-blank-line-before-class",
    "missing-blank-line-after-summary",
    "missing-copyright-notice",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "print",
    "single-line-implicit-string-concatenation",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "suspicious-url-open-usage",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"simulator/*" = ["implicit-namespace-package"]
"tests/*" = [
    "assert",
    "boolean-type-hint-positional-argument",
    "compare-to-empty-string",
    "hardcoded-temp-file",
    "implicit-namespace-package",
    "magic-value-comparison",
    "pytest-fixture-autouse",
]

[tool.tomlsort]
sort_table_keys = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true

[tool.tox]
env_list = ["lint", "build", "test"]
requires = ["tox>=4.21", "tox-uv"]

[tool.tox.env.build]
allowlist_externals = ["uv"]
commands = [["uv", "build", "--clear", "--quiet"]]
skip_install = true

[tool.tox.env.lint]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit==4.6.2"]
set_env = { SKIP = "no-commit-to-branch" }
skip_install = true

[tool.tox.env.test]
base_python = ["3.12"]
commands = [
    ["coverage", "run", "-m", "pytest", { replace = "posargs", extend = true }],
    ["coverage", "combine", "--quiet"],
    ["coverage", "report"],
    ["coverage", "html", "--quiet"],
    ["coverage", "json", "--quiet"],
    [
        "python",
        "-c",
        "import json, sys; files = json.load(open('coverage.json'))['files']; low = [f'{name}: {data[\"summary\"][\"percent_covered\"]:.1f}%' for name, data in sorted(files.items()) if data['summary']['percent_covered'] < 90]; sys.exit('under 90% coverage:\\n' + '\\n'.join(low) if low else 0)",
    ],
]
depends = ["build"]
deps = ["coverage==7.10.7", "pytest"]
extras = ["brotli"]
package = "wheel"
